services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    environment:
      - TZ=${TZ}
      - ND_SCANSCHEDULE=1h
      - ND_SCANNER_PURGEMISSING=always
    volumes:
      - data:/data
      - "${MUSIC}:/music:ro"
    ports:
      - "4533:4533"
    restart: unless-stopped
volumes:
    data:
